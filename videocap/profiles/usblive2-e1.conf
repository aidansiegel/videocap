# Hauppauge USB-Live2, Rev E1 (USB ID 2040:c220), em28xx-based.
# Needs a patched em28xx driver (see docs/profiles.md); with the stock driver only its sound works.
# Measured with Hi8 and VHS tapes, NTSC, November 2026.

# The driver reports plain "interlaced" (by the V4L2 spec, bottom first for NTSC), but the stick sends top field
# first: ffmpeg's idet on a 2-hour tape counted 3,597 frames TFF and none BFF.
FIELD_ORDER=tff

# The blank margins at the sides and the head-switching noise in the last lines.
MP4_CROP=12:4:0:8

# The picture comes through the stick a few frames after its sound: camera cuts put the sound 70-100 ms early.
AUDIO_DELAY_MS=80

# The driver says every input is "ok" whether or not anything is plugged in, but has a lock_status control. The
# lock bit drops out for a second or two even on steady playback, so a lock in the last 4 s counts.
SIGNAL_CONTROL=lock_status
SIGNAL_HOLD_SEC=4

# Its "Line" capture volume has no effect on the level (identical from 0 to 15 dB), and each change upsets the
# input for 2-3 s, so leave it alone. For more headroom use inline RCA attenuators.
AUDIO_GAIN=
