[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "videocap"
version = "0.1.0"
description = "Unattended capture from analog video sources: lossless masters and MP4s, for whole collections"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video :: Capture",
    "Environment :: No Input/Output (Daemon)",
]

[project.scripts]
videocap = "videocap.__main__:main"

[tool.setuptools]
packages = ["videocap"]

[tool.setuptools.package-data]
videocap = ["static/*.html", "profiles/*.conf"]
