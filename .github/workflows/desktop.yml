# Builds the Videocap desktop app (desktop/): a station finder for Mac, Windows and Linux. On a version tag the apps
# are attached to that release; run it by hand (Actions -> Desktop app -> Run workflow) to get them as artifacts.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test desktop/test/stations.test.js

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The app's version is the release's
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm install --no-audit --no-fund
      # unsigned: no Apple or Windows signing certificate (see README: how to open it the first time)
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: "Smoke test (Linux): the built app starts and keeps running, with no errors in its log"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -q xvfb >/dev/null
          set +e
          ELECTRON_ENABLE_LOGGING=1 xvfb-run -a timeout 25 dist/linux-unpacked/videocap-desktop --no-sandbox > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          [ "$code" -eq 124 ] || { echo "the app exited early (code $code)"; exit 1; }
          if grep -E "Uncaught|TypeError|ReferenceError|Error: Cannot find module" smoke.log; then echo "errors in the log"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: videocap-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          retention-days: 30
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/*.AppImage)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
